<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"/>
  <title>Place Value Visualizer</title>
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;700;900&display=swap" rel="stylesheet"/>
  <style>
    *{margin:0;padding:0;box-sizing:border-box}
    body{font-family:'Nunito',sans-serif;background:#faf9f6;color:#1e293b;height:100vh;height:100dvh;overflow:hidden;user-select:none;display:flex;flex-direction:column}
    
    #topBar{padding:8px 16px;display:flex;align-items:center;justify-content:space-between;flex-shrink:0;background:#fff;border-bottom:1px solid #e5e7eb;z-index:10;flex-wrap:wrap;gap:6px}
    .btns{display:flex;gap:4px;flex-wrap:wrap}
    .ab{background:#fff;border:2px solid #e5e7eb;color:#1e293b;padding:6px 12px;border-radius:8px;font-size:12px;font-weight:700;font-family:inherit;cursor:pointer;transition:all 0.1s}
    .ab:hover{border-color:#6366f1;color:#6366f1}.ab.on{background:#6366f1;color:#fff;border-color:#6366f1}
    
    .ab.mult{background:#fff;border-color:#22c55e;color:#22c55e}
    .ab.mult:hover:not(:disabled){background:#22c55e;color:#fff}
    .ab.divd{background:#fff;border-color:#f59e0b;color:#f59e0b}
    .ab.divd:hover:not(:disabled){background:#f59e0b;color:#fff}
    .ab:disabled{opacity:0.2;cursor:not-allowed}
    
    #numBar{flex-shrink:0;display:flex;align-items:center;padding:10px 16px;min-height:86px;background:#fff;border-bottom:1px solid #f1f5f9;gap:10px}
    #numInput{font-family:inherit;font-size:22px;font-weight:900;color:#1e293b;border:2px solid #e5e7eb;border-radius:10px;padding:8px 14px;width:160px;text-align:center;outline:none}
    #resetBtn{padding:10px 16px;font-size:14px;border-color:#cbd5e1;background:#f8fafc;font-weight:900;color:#ef4444}
    
    #numDisplay{position:absolute;left:50%;transform:translateX(-50%);font-size:54px;font-weight:900;color:#1e293b;display:flex;align-items:baseline;pointer-events:none}
    
    #vp{flex:1;position:relative;overflow:hidden;cursor:grab;touch-action:none}
    canvas{position:absolute;top:0;left:0}
    #animCanvas{position:absolute;top:0;left:0;pointer-events:none;z-index:5}
    
    .digit{cursor:pointer;border-radius:6px;padding:0 4px;transition:background .15s;pointer-events:auto}
    .digit:hover{background:#e2e8f0!important}
    #animStatus{position:absolute;bottom:36px;left:50%;transform:translateX(-50%);font-size:12px;font-weight:900;color:#6366f1;background:rgba(255,255,255,.95);padding:4px 16px;border-radius:8px;pointer-events:none;opacity:0;transition:opacity .3s;z-index:10}
    #animStatus.show{opacity:1}
    
    #pmBar{position:absolute;bottom:6px;left:0;right:0;display:flex;justify-content:center;gap:2px;z-index:8;pointer-events:none}
    .pm-grp{display:flex;flex-direction:column;align-items:center;gap:1px;pointer-events:auto}
    .pm-btn{width:24px;height:20px;border:1.5px solid #cbd5e1;border-radius:4px;background:#fff;font-size:14px;font-weight:900;text-align:center;cursor:pointer;color:#64748b;padding:0}
    .pm-lbl{font-size:7px;font-weight:900;color:#94a3b8;white-space:nowrap;margin:2px 0}
  </style>
</head>
<body>

<div id="topBar">
  <span style="font-size:13px;font-weight:900;color:#6366f1">Place Value Visualizer</span>
  <div class="btns">
    <button class="ab mult" id="mult1000Btn">×1000</button>
    <button class="ab mult" id="mult100Btn">×100</button>
    <button class="ab mult" id="multBtn">×10</button>
    <button class="ab divd" id="divBtn">÷10</button>
    <button class="ab divd" id="div100Btn">÷100</button>
    <button class="ab divd" id="div1000Btn">÷1000</button>
    <button class="ab" id="decBtn">Decimals</button>
    <button class="ab" id="zeroBtn">Show Zeros</button>
    <button class="ab" id="newBtn">New Number</button>
  </div>
</div>

<div id="numBar">
  <input type="text" id="numInput" placeholder="Type a number…" autocomplete="off" />
  <button class="ab" id="resetBtn">🔄 Reset</button>
  <span id="numDisplay"></span>
</div>

<div id="vp">
  <canvas id="cv"></canvas>
  <canvas id="animCanvas"></canvas>
  <div id="animStatus"></div>
  <div id="pmBar"></div>
</div>

<script>
// --- DATA ---
const CC=['#ef4444','#3b82f6','#22c55e','#f59e0b','#8b5cf6','#0d9488'];
const NAMES=['Trillions','Hundred-Billions','Ten-Billions','Billions','Hundred-Millions','Ten-Millions','Millions','Hundred-Thousands','Ten-Thousands','Thousands','Hundreds','Tens','Ones','Tenths','Hundredths','Thousandths'];
const SHAPES=['cube','flat','stick','cube','flat','stick','cube','flat','stick','cube','flat','stick','cube','flat','stick','cube'];
const DEC=13, ONES=12, NP=16;
const P=NAMES.map((n,i)=>({name:n,color:CC[i%6],shape:SHAPES[i],exp:12-i}));
const U=8, N=10, GAP=0.2, DEP=0.3, FLOOR_Y_OFFSET=120, ZOOM_MIN=0.01, ZOOM_MAX=100;

let digits=Array(NP).fill(0);
let showZeros=false, showDecimals=false;
let panX=0, zoomLvl=1.0, highlightedPlace=null, animating=false;

// --- UTILS ---
function cs(hex,a){let r=parseInt(hex.slice(1,3),16),g=parseInt(hex.slice(3,5),16),b=parseInt(hex.slice(5,7),16);return`rgb(${Math.min(255,Math.max(0,r+a))},${Math.min(255,Math.max(0,g+a))},${Math.min(255,Math.max(0,b+a))})`}
function bp(i,u){return i*u*(1+GAP)}
function stickLen(u){return bp(N-1,u)+u}
function addCommas(s){const p=s.split('.');let wf='',w=(p[0]||'0').split('').reverse();for(let i=0;i<w.length;i++){if(i>0&&i%3===0)wf=','+wf;wf=w[i]+wf}return p[1]!==undefined?wf+'.'+p[1]:wf}

function unitForPlace(pi){
  const z=U*zoomLvl, sL=stickLen(z);
  const e=P[pi].exp;
  if(e>=0&&e<=2) return z;
  if(e>=3&&e<=5) return sL;
  if(e>=6&&e<=8) return stickLen(sL);
  if(e>=9&&e<=11) return stickLen(stickLen(sL));
  if(e===12) return stickLen(stickLen(stickLen(sL)));
  return z;
}

function secDims(u,shape){const sL=stickLen(u),d=u*DEP,ds=d*0.6;if(shape==='cube')return{w:u+d,h:sL+d};if(shape==='stick')return{w:sL+d,h:sL+d};return{w:sL+ds*N+d,h:sL+ds*N+d}}
function colW(pi){const u=unitForPlace(pi),dims=secDims(u,P[pi].shape);return dims.w+Math.max(P[pi].shape==='cube'?u*3:u*0.5,30)}

function worldX(pi){
  let x=0; 
  if(pi<ONES){for(let i=ONES-1;i>=pi;i--){x-=colW(i); if(i===DEC)x-=(unitForPlace(ONES)*0.75)}}
  else if(pi>ONES){for(let i=ONES+1;i<=pi;i++){x+=colW(i-1); if(i===DEC)x+=(unitForPlace(ONES)*0.75)}}
  return x;
}

function setNumber(n){
  const w=Math.floor(n), f=Math.round((n-w)*1000);
  for(let i=0;i<13;i++) digits[i] = Math.floor(w / Math.pow(10, 12-i)) % 10;
  digits[13]=Math.floor(f/100)%10; digits[14]=Math.floor(f/10)%10; digits[15]=f%10;
}

function digitsToStr(){
  let first=-1; for(let i=0;i<=ONES;i++)if(digits[i]>0){first=i;break}
  let w=''; const start=first>=0?first:ONES; for(let i=start;i<=ONES;i++)w+=digits[i];
  let d='', lastDec=-1; for(let i=DEC;i<NP;i++)if(digits[i]>0)lastDec=i;
  if(lastDec>=0){for(let i=DEC;i<=lastDec;i++)d+=digits[i]; return w+'.'+d}
  return w;
}

// --- RENDER ---
function render(od){
  const vpEl=document.getElementById('vp'), cv=document.getElementById('cv');
  const W=vpEl.clientWidth, H=vpEl.clientHeight, dpr=window.devicePixelRatio||1;
  cv.width=W*dpr; cv.height=H*dpr; cv.style.width=W+'px'; cv.style.height=H+'px';
  const ctx=cv.getContext('2d'); ctx.scale(dpr,dpr); ctx.clearRect(0,0,W,H);
  const vcx=W/2, floorY=H-FLOOR_Y_OFFSET;

  if(highlightedPlace!==null){
    const pi=highlightedPlace, wx=worldX(pi), cw=colW(pi), sx=wx-panX+vcx;
    ctx.fillStyle='rgba(255,250,150,0.45)'; ctx.fillRect(sx,0,cw*0.82,H);
  }
  
  ctx.strokeStyle='#cbd5e1'; ctx.lineWidth=2; ctx.beginPath(); ctx.moveTo(0,floorY); ctx.lineTo(W,floorY); ctx.stroke();
  const end=showDecimals?NP:DEC;
  for(let i=0;i<end;i++){
    const wx=worldX(i), cw=colW(i), sx=wx-panX+vcx;
    if(sx+cw<-400||sx>W+400)continue;
    ctx.save(); ctx.translate(sx,0);
    drawPlace(ctx,0,0,i,cw,floorY,od);
    ctx.restore();
  }
}

function drawPlace(ctx,ox,oy,pi,cW,H,od){
  const p=P[pi], cnt=(od||digits)[pi], col=p.color, u=unitForPlace(pi); if(u<0.3)return;
  const subU=(pi<NP-1&&pi<ONES)?unitForPlace(pi+1):u;
  const step=u*(1+GAP), d=u*DEP, sL=stickLen(u), ds=d*0.6, floor=oy+H-2, cy=floor-sL, cx=ox;
  if(u*1.2>3){ctx.font=`900 ${u*1.2}px Nunito`;ctx.fillStyle=col;ctx.fillText(p.name,ox,cy-ds*N-d-u*1.5)}

  if(p.shape==='cube'){
    if(u > 15){ // Macro check
      if(u>1)for(let i=N-1;i>=0;i--)ghostMacroCube(ctx,cx,cy+bp(i,u),subU);
      for(let i=0;i<cnt;i++)isoMacroCube(ctx,cx,cy+bp(N-1-i,u),subU,col);
    } else {
      if(u>1)ghostCubeCol(ctx,cx,cy,u);
      for(let i=0;i<cnt;i++)iso(ctx,cx,cy+bp(N-1-i,u),u,col);
    }
  } else if(p.shape==='stick'){
    if(u>1)ghostStickGrid(ctx,cx,cy,u);
    for(let c=0;c<cnt;c++)for(let r=0;r<N;r++)iso(ctx,cx+bp(c,u),cy+bp(r,u),u,col);
  } else {
    if(u>1)ghostFlatCube(ctx,cx,floor-sL,u);
    for(let fl=0;fl<cnt;fl++)for(let la=N-1;la>=0;la--)for(let r=N-1;r>=0;r--)iso(ctx,cx+fl*step+ds*la,floor-sL-ds*la+bp(r,u),u,col);
  }
}

function iso(ctx,x,y,u,col){
  if(u<0.8)return; const d=u*DEP; ctx.fillStyle=col; ctx.fillRect(x,y,u,u);
  ctx.beginPath();ctx.moveTo(x,y);ctx.lineTo(x+d,y-d);ctx.lineTo(x+u+d,y-d);ctx.lineTo(x+u,y);ctx.fillStyle=cs(col,45);ctx.fill();
  ctx.beginPath();ctx.moveTo(x+u,y);ctx.lineTo(x+u+d,y-d);ctx.lineTo(x+u+d,y+u-d);ctx.lineTo(x+u,y+u);ctx.fillStyle=cs(col,-40);ctx.fill();
}
function isoMacroCube(ctx,bx,by,su,col){
  const step=su*(1+GAP), ds=su*DEP*0.6;
  for(let la=N-1;la>=0;la--)for(let c=N-1;c>=0;c--)for(let r=0;r<N;r++)iso(ctx,bx+ds*la+c*step,by-ds*la+r*step,su,col);
}
const GF='rgba(180,190,200,0.12)', GS='rgba(160,170,180,0.35)', GT='rgba(200,210,220,0.15)', GR='rgba(140,150,160,0.18)';
function ghostMacroCube(ctx,bx,by,su){
  const u=stickLen(su), ds=su*DEP*0.6, tdx=ds*N, tdy=ds*N;
  ctx.fillStyle=GF; ctx.fillRect(bx+tdx,by-tdy,u,u); ctx.strokeStyle=GS; ctx.strokeRect(bx+tdx,by-tdy,u,u);
  ctx.beginPath(); ctx.moveTo(bx,by); ctx.lineTo(bx+tdx,by-tdy); ctx.lineTo(bx+u+tdx,by-tdy); ctx.lineTo(bx+u,by); ctx.fillStyle=GT; ctx.fill(); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(bx+u,by); ctx.lineTo(bx+u+tdx,by-tdy); ctx.lineTo(bx+u+tdx,by+u-tdy); ctx.lineTo(bx+u,by+u); ctx.fillStyle=GR; ctx.fill(); ctx.stroke();
  ctx.fillStyle=GF; ctx.fillRect(bx,by,u,u); ctx.strokeRect(bx,by,u,u);
}
function ghostCubeCol(ctx,cx,cy,u){ctx.fillStyle=GF;ctx.fillRect(cx,cy,u,stickLen(u));ctx.strokeStyle=GS;ctx.strokeRect(cx,cy,u,stickLen(u))}
function ghostStickGrid(ctx,cx,cy,u){ctx.fillStyle=GF;ctx.fillRect(cx,cy,stickLen(u),stickLen(u));ctx.strokeStyle=GS;ctx.strokeRect(cx,cy,stickLen(u),stickLen(u))}
function ghostFlatCube(ctx,cx,cy,u){ctx.fillStyle=GF;ctx.fillRect(cx,cy,stickLen(u),stickLen(u));ctx.strokeStyle=GS;ctx.strokeRect(cx,cy,stickLen(u),stickLen(u))}

// --- ANIMATION ---
async function animateShift(dir){
  const vpEl=document.getElementById('vp'), acv=document.getElementById('animCanvas'), dpr=window.devicePixelRatio||1;
  acv.width=vpEl.clientWidth*dpr; acv.height=vpEl.clientHeight*dpr; acv.style.width=vpEl.clientWidth+'px'; acv.style.height=vpEl.clientHeight+'px';
  const ctx=acv.getContext('2d'); ctx.scale(dpr,dpr);

  const sd=[...digits], moves=[];
  if(dir==='left') for(let i=1;i<NP;i++) if(sd[i]>0) moves.push(i);
  else for(let i=NP-2;i>=0;i--) if(sd[i]>0) moves.push(i);
  
  let wd=[...sd];
  for(let sp of moves){
    let dp = dir==='left' ? sp-1 : sp+1;
    document.getElementById('animStatus').textContent=`${P[sp].name} → ${P[dp].name}`;
    document.getElementById('animStatus').classList.add('show');
    wd[sp]=0; render(wd);
    await animateTransition(ctx,vpEl.clientWidth,vpEl.clientHeight-FLOOR_Y_OFFSET,sp,dp,sd[sp]);
    wd[dp]=Math.min(9, wd[dp]+sd[sp]); ctx.clearRect(0,0,vpEl.clientWidth,vpEl.clientHeight); render(wd);
  }
  document.getElementById('animStatus').classList.remove('show');
  if(dir==='left'){const nd=Array(NP).fill(0);for(let i=1;i<NP;i++)nd[i-1]=digits[i];digits=[...nd]}
  else{const nd=Array(NP).fill(0);for(let i=0;i<NP-1;i++)nd[i+1]=digits[i];digits=[...nd]}
  if(dir==='right' && (digits[13]+digits[14]+digits[15]>0)){showDecimals=true; document.getElementById('decBtn').classList.add('on')}
  render(); renderNum(); updatePMBar();
}

function animateTransition(ctx,W,floorY,sp,dp,cnt){
  const sU=unitForPlace(sp), dU=unitForPlace(dp), vcx=W/2;
  const sWX=worldX(sp), dWX=worldX(dp), sCy=floorY-stickLen(sU), dCy=floorY-stickLen(dU);
  return new Promise(res=>{
    const t0=performance.now();
    function f(now){
      const t=Math.min(1,(now-t0)/1000); ctx.clearRect(0,0,W,floorY+FLOOR_Y_OFFSET);
      for(let i=0;i<cnt;i++){
        const ft=Math.max(0,Math.min(1,(t-(i*0.06))/0.7));
        const ep=ft<.5?2*ft*ft:1-Math.pow(-2*ft+2,2)/2;
        const x = (sWX + (dWX-sWX)*ep)-panX+vcx;
        const y = (sCy+bp(N-1-i,sU)) + ((dCy+bp(i,dU)) - (sCy+bp(N-1-i,sU)))*ep;
        iso(ctx, x, y, dU, P[sp].color);
      }
      if(t<1) requestAnimationFrame(f); else res();
    }
    requestAnimationFrame(f);
  });
}

async function runMultiShift(type, steps){
  if(animating) return; animating=true;
  for(let s=0; s<steps; s++){
    if(type==='mult'){ if(digits[0]>0)break; await animateShift('left') }
    else { if(digits[NP-1]>0)break; await animateShift('right') }
    await new Promise(r=>setTimeout(r, 100));
  }
  animating=false; updatePMBar();
}

// --- IDENTITY PROOF LOGIC ---
function renderNum(){
  const disp=document.getElementById('numDisplay'), inp=document.getElementById('numInput');
  
  // Find standard bounds
  let firstIdx=ONES; for(let i=0; i<ONES; i++) if(digits[i]>0){ firstIdx=i; break; }
  let lastDec=-1; for(let i=15; i>=DEC; i--) if(digits[i]>0){ lastDec=i; break; }

  // Apply Show Zeros spread
  let start = showZeros ? Math.min(3, firstIdx) : firstIdx;
  let end = showZeros ? 15 : lastDec;

  let rawWhole = "";
  for(let i=start; i<=ONES; i++) rawWhole += digits[i];
  let wholeF = addCommas(rawWhole);

  let decF = "";
  if(showDecimals && end >= DEC){
    decF = ".";
    for(let i=DEC; i<=end; i++) decF += digits[i];
  }

  const final = wholeF + decF;
  if(document.activeElement!==inp) inp.value = final;

  let html = "";
  let cur = start;
  for(let ch of wholeF){
    if(ch===","){ html += '<span style="color:#94a3b8">,</span>'; continue; }
    const pi=cur++; html += `<span class="digit" style="background:${highlightedPlace===pi?P[pi].color:'transparent'};color:${highlightedPlace===pi?'#fff':'inherit'}" onclick="window.toggleHighlight(${pi})">${ch}</span>`;
  }
  if(decF){
    html += '<span style="color:#94a3b8">.</span>';
    for(let i=0; i<decF.length-1; i++){
      const pi=DEC+i; html += `<span class="digit" style="background:${highlightedPlace===pi?P[pi].color:'transparent'};color:${highlightedPlace===pi?'#fff':'inherit'}" onclick="window.toggleHighlight(${pi})">${decF[i+1]}</span>`;
    }
  }
  disp.innerHTML = html;
}

// --- EVENTS ---
document.getElementById('multBtn').onclick=()=>runMultiShift('mult',1);
document.getElementById('mult100Btn').onclick=()=>runMultiShift('mult',2);
document.getElementById('mult1000Btn').onclick=()=>runMultiShift('mult',3);
document.getElementById('divBtn').onclick=()=>runMultiShift('div',1);
document.getElementById('div100Btn').onclick=()=>runMultiShift('div',2);
document.getElementById('div1000Btn').onclick=()=>runMultiShift('div',3);

document.getElementById('resetBtn').onclick=()=>{
  if(animating)return; digits=Array(NP).fill(0); highlightedPlace=null; setNumber(0);
  renderNum(); render(); updatePMBar(); document.getElementById('numInput').value=""; document.getElementById('numInput').focus();
};

document.getElementById('numInput').onkeydown=(e)=>{
  if(e.key!=='Enter')return;
  const raw = e.target.value.replace(/,/g,'');
  if(raw.includes('.')){ showDecimals=true; document.getElementById('decBtn').classList.add('on'); }
  setNumber(parseFloat(raw) || 0); e.target.blur(); renderNum(); render(); updatePMBar();
};

document.getElementById('decBtn').onclick=function(){showDecimals=!showDecimals;this.classList.toggle('on',showDecimals);renderNum();render();updatePMBar()};
document.getElementById('zeroBtn').onclick=function(){showZeros=!showZeros;this.classList.toggle('on',showZeros);renderNum();updatePMBar()};
document.getElementById('newBtn').onclick=()=>{setNumber(Math.random()*100); renderNum(); render()};

const vp=document.getElementById('vp');
vp.onwheel=(e)=>{e.preventDefault(); zoomLvl=Math.max(ZOOM_MIN, Math.min(ZOOM_MAX, zoomLvl*(1-e.deltaY*0.001))); render()};
let dr=false, sx=0, sp=0;
vp.onmousedown=(e)=>{if(e.target.closest('.pm-grp'))return;dr=true;sx=e.pageX;sp=panX};
window.onmousemove=(e)=>{if(dr){panX=sp-(e.pageX-sx);render()}};
window.onmouseup=()=>dr=false;

window.toggleHighlight=(pi)=>{highlightedPlace=(highlightedPlace===pi)?null:pi;renderNum();render()};

function updatePMBar(){
  const bar=document.getElementById('pmBar'), end=showDecimals?NP:DEC;
  let h=''; for(let i=Math.max(0,ONES-2); i<Math.min(end,ONES+4); i++){
    const col=P[i].color;
    h+=`<div class="pm-grp">
      <button class="pm-btn" style="color:${col};border-color:${col}" onclick="window.inc(${i})">+</button>
      <span class="pm-lbl" style="color:${col}">${P[i].name.slice(0,5)}</span>
      <button class="pm-btn" style="color:${col};border-color:${col}" onclick="window.dec(${i})">−</button>
    </div>`;
  }
  bar.innerHTML=h;
}
window.inc=(i)=>{if(digits[i]<9){digits[i]++}else if(i>0){digits[i]=0;digits[i-1]++}renderNum();render();updatePMBar()};
window.dec=(i)=>{if(digits[i]>0){digits[i]--}else if(i>0&&digits[i-1]>0){digits[i-1]--;digits[i]=9}renderNum();render();updatePMBar()};

// Start
setNumber(54.6);
showDecimals=true; document.getElementById('decBtn').classList.add('on');
renderNum(); render(); updatePMBar();
</script>
</body>
</html>
